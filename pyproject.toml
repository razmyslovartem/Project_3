[tool.poetry]
name = "project-3"
version = "0.1.0"
description = ""
authors = ["Artem Razmyslov <89083284426@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.33.1"
psycopg2-binary = ">=2.9.11,<3.0.0"
prettytable = ">=3.17.0,<4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
black = ">=26.3.1,<27.0.0"
mypy = ">=1.20.0,<2.0.0"
flake8 = ">=7.3.0,<8.0.0"
isort = ">=8.0.1,<9.0.0"

[tool.poetry.group.dev.dependencies]
types-psycopg2 = ">=2.9.21.20260408,<3.0.0.0"
types-requests = ">=2.33.0.20260408,<3.0.0.0"

[tool.mypy]
python_version = "3.13"
show_error_codes = true
ignore_missing_imports = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
strict_optional = true
exclude = [".git", ".venv", "venv", "__pycache__"]
exclude_gitignore = true

[[tool.mypy.overrides]]
module = ['tests.*'] # для какого модуля
allow_untyped_defs = true # переопределение настройки

[tool.black]
line-length = 119
target-version = ['py39']
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.github
  | deploy
  | migrations
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
)/
'''

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
force_single_line = true
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
line_length = 119
skip = [".git", ".venv", "venv", "__pycache__"]
skip_glob = [
    "**/migrations/**",
    "docs/*",
    "*.txt",
    ".git",
    ".github",
    ".venv",
    ".deploy",
    ".mypy_cache",
    ".pytest_cache"
]
combine_as_imports = true
known_first_party = ["Project_3"]
src_paths = ["src", "test"]
